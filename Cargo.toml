[package]
name = "odek-three-d-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
glam = { version = "0.32.1", features = ["bytemuck"] } # byemuck = glam POD version
eframe = { version = "0.34.1", features = ["wgpu"] }
egui = "0.34.1"
wgpu = { version = "29.0.3", features = ["webgpu", "webgl"] }
bytemuck = "1.25.0"
env_logger = "0.11.10"

# Import File
tobj = "4.0"
rfd = { version = "0.15", features = ["xdg-portal"] }
wgpu-types = "29.0.3"

# Non-WASM
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.51.1", features = ["rt-multi-thread", "macros", "sync"] }

# WASM
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
log = "0.4"
web-sys = "0.3.70"
getrandom = { version = "0.3", features = ["wasm_js"] }
# getrandom = { version = "0.3", features = ["js"] }
ahash = "0.8"
